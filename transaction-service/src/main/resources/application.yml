spring:
  application:
    name: transaction-service
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=ewallet_transaction
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8083

customer:
  service:
    url: http://localhost:8081

merchant:
  service:
    url: http://localhost:8084

logging:
  level:
    root: INFO
    com.ewallet: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/transaction-service.log

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

